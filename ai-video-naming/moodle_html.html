<script>
document.addEventListener('DOMContentLoaded', function () {
  // Transform live sessions into thumbnail cards
  function transformLiveSessions() {
    // Find live session items - they have span.nowrap with "Watch live" link
    var listItems = document.querySelectorAll('.block_panopto .listItem, .block_panopto .listItemAlt');
    
    for (var i = 0; i < listItems.length; i++) {
      var item = listItems[i];
      
      // Skip if already transformed
      if (item.getAttribute('data-live-transformed') === '1') continue;
      
      // Check if this is a live session - has nowrap span with "Watch live" link
      var nowrapSpan = item.querySelector('span.nowrap');
      if (!nowrapSpan) continue;
      
      // Find the "Watch live" link (direct Viewer.aspx link, not javascript:)
      var watchLiveLink = null;
      var links = nowrapSpan.querySelectorAll('a');
      for (var l = 0; l < links.length; l++) {
        var linkHref = links[l].getAttribute('href') || '';
        if (linkHref.indexOf('Viewer.aspx') !== -1 && linkHref.indexOf('javascript:') === -1) {
          watchLiveLink = links[l];
          break;
        }
      }
      
      if (!watchLiveLink) continue;
      
      // Get the session name (text before the nowrap span)
      var sessionName = '';
      for (var j = 0; j < item.childNodes.length; j++) {
        if (item.childNodes[j].nodeType === Node.TEXT_NODE) {
          sessionName += item.childNodes[j].textContent;
        }
      }
      sessionName = sessionName.trim();
      if (!sessionName) sessionName = 'Live Session';
      
      // Get the actual href
      var href = watchLiveLink.getAttribute('href').replace(/&amp;/g, '&');
      
      // Extract session ID for thumbnail
      var idMatch = href.match(/[?&]id=([^&]+)/i);
      if (!idMatch) continue;
      var sessionId = decodeURIComponent(idMatch[1]);
      
      // Extract origin from the href
      var origin = 'https://ioe.cloud.panopto.eu';
      try {
        var urlObj = new URL(href, window.location.href);
        origin = urlObj.origin;
      } catch (e) {
        var match = href.match(/^(https?:\/\/[^\/]+)/i);
        if (match) origin = match[1];
      }
      
      // Mark as transformed
      item.setAttribute('data-live-transformed', '1');
      item.classList.add('panopto-live-session');
      
      // Clear the item content
      item.innerHTML = '';
      
      // Create a new anchor element styled like the recordings
      var newLink = document.createElement('a');
      newLink.href = href;
      newLink.setAttribute('onclick', 'return panopto_startSSO(this)');
      newLink.classList.add('has-panopto-meta');
      newLink.setAttribute('data-meta-set', '1');
      
      // Set thumbnail
      var thumb = origin + '/Panopto/Services/FrameGrabber.svc/FrameRedirect?objectId='
        + encodeURIComponent(sessionId) + '&mode=Delivery';
      newLink.style.setProperty('--panopto-thumb', 'url("' + thumb + '")');
      newLink.setAttribute('data-thumb-set', '1');
      
      // Add title
      var titleSpan = document.createElement('span');
      titleSpan.className = 'panopto-thumb-title';
      titleSpan.textContent = sessionName;
      newLink.appendChild(titleSpan);
      
      // Add play button overlay (since ::after is used for the red pulse dot)
      var playBtn = document.createElement('span');
      playBtn.className = 'panopto-play-btn';
      playBtn.textContent = '\u25B6';
      newLink.appendChild(playBtn);
      
      // Add LIVE badge instead of date
      var metaSpan = document.createElement('span');
      metaSpan.className = 'panopto-meta-date';
      var liveBadge = document.createElement('span');
      liveBadge.className = 'panopto-live-badge';
      liveBadge.textContent = '🔴 LIVE NOW';
      metaSpan.appendChild(liveBadge);
      newLink.appendChild(metaSpan);
      
      item.appendChild(newLink);
    }
    
    // Hide the "Live sessions" and "Completed recordings" headers for thumb layout
    var headers = document.querySelectorAll('.block_panopto #block_panopto_content > div > b');
    for (var k = 0; k < headers.length; k++) {
      var headerText = headers[k].textContent.trim().toLowerCase();
      if (headerText === 'live sessions' || headerText === 'completed recordings') {
        headers[k].parentNode.style.display = 'none';
      }
    }
    var sectionHeaders = document.querySelectorAll('.block_panopto .sectionHeader');
    for (var m = 0; m < sectionHeaders.length; m++) {
      var text = sectionHeaders[m].textContent.trim().toLowerCase();
      if (text === 'completed recordings') {
        sectionHeaders[m].style.display = 'none';
      }
    }
  }

  // Move 4th item out of hidden div to show 4 in collapsed view
  var movedItem = null;
  var hiddenDivRef = null;
  
  function show4InCollapsed() {
    var hiddenDiv = document.getElementById('hiddenLecturesDiv');
    var showAllDiv = document.getElementById('showAllDiv');
    if (!hiddenDiv || !showAllDiv) return;
    
    hiddenDivRef = hiddenDiv;
    
    // Check if already expanded (hidden div is visible)
    var isExpanded = hiddenDiv.style.display === 'block';
    
    if (isExpanded) {
      // If expanded and we have a moved item, put it back
      if (movedItem && movedItem.parentNode !== hiddenDiv) {
        hiddenDiv.insertBefore(movedItem, hiddenDiv.firstChild);
      }
    } else {
      // If collapsed, move the first hidden item out
      if (!movedItem || movedItem.parentNode === hiddenDiv) {
        var firstHidden = hiddenDiv.querySelector('.listItem, .listItemAlt');
        if (firstHidden) {
          movedItem = firstHidden;
          showAllDiv.parentNode.insertBefore(firstHidden, showAllDiv);
        }
      }
    }
  }

  // Parse session name formats:
  // New: [Week X · Day Y] AI Topic | DD/MM/YYYY HH:MM AM/PM
  // New: [Week X] AI Topic | DD/MM/YYYY HH:MM AM/PM
  // New: [Day X] AI Topic | DD/MM/YYYY HH:MM AM/PM
  // Old: [DD/MM/YYYY HH:MM AM/PM] Original Name | AI Topic
  function parseSessionName(text) {
    if (!text) return null;
    
    // Week + Day format: [Week X · Day Y] AI Topic | date
    var weekDayMatch = text.match(/^\[Week\s*(\d+)\s*[·•]\s*Day\s*(\d+)\]\s*(.+?)\s*\|\s*(.+)$/i);
    if (weekDayMatch) {
      return {
        week: parseInt(weekDayMatch[1]),
        day: parseInt(weekDayMatch[2]),
        topic: weekDayMatch[3].trim(),
        date: weekDayMatch[4].trim(),
        original: null
      };
    }
    
    // New format: [Week X] AI Topic | date
    var weekMatch = text.match(/^\[Week\s*(\d+)\]\s*(.+?)\s*\|\s*(.+)$/i);
    if (weekMatch) {
      return {
        week: parseInt(weekMatch[1]),
        day: null,
        topic: weekMatch[2].trim(),
        date: weekMatch[3].trim(),
        original: null
      };
    }
    
    // Day format: [Day X] AI Topic | date
    var dayMatch = text.match(/^\[Day\s*(\d+)\]\s*(.+?)\s*\|\s*(.+)$/i);
    if (dayMatch) {
      return {
        week: null,
        day: parseInt(dayMatch[1]),
        topic: dayMatch[2].trim(),
        date: dayMatch[3].trim(),
        original: null
      };
    }
    
    // No-week format: [date time] AI Topic | Original Name
    var dateMatch = text.match(/^\[(\d{1,2}\/\d{1,2}\/\d{4}(?:\s+\d{1,2}:\d{2}\s*[AP]M)?)\]\s*(.+?)\s*\|\s*(.+)$/i);
    if (dateMatch) {
      return {
        week: null,
        day: null,
        date: dateMatch[1],
        original: dateMatch[3].trim(),
        topic: dateMatch[2].trim()
      };
    }
    
    // Fallback: anything | anything
    var pipeMatch = text.match(/^(.+?)\s*\|\s*(.+)$/);
    if (pipeMatch) {
      return {
        week: null,
        day: null,
        date: null,
        original: pipeMatch[1].trim(),
        topic: pipeMatch[2].trim()
      };
    }
    
    return null;
  }

  function extractSessionId(href) {
    if (!href) return null;
    href = href.replace(/&amp;/g, '&');
    var m = href.match(/[?&]id=([^&]+)/i);
    return m ? decodeURIComponent(m[1]) : null;
  }

  function applyPanoptoEnhancements() {
    var links = document.querySelectorAll(
      '.block_panopto .listItem > a[href*="Viewer.aspx"][href*="id="],' +
      '.block_panopto .listItemAlt > a[href*="Viewer.aspx"][href*="id="]'
    );

    for (var i = 0; i < links.length; i++) {
      var a = links[i];
      var href = a.getAttribute('href');
      var id = extractSessionId(href);
      if (!id) continue;

      // Apply thumbnail if not already set
      if (a.getAttribute('data-thumb-set') !== '1') {
        var origin;
        try {
          origin = (new URL(href.replace(/&amp;/g, '&'), window.location.href)).origin;
        } catch (e) {
          origin = href.split('/Panopto/')[0];
        }

        var thumb = origin + '/Panopto/Services/FrameGrabber.svc/FrameRedirect?objectId='
          + encodeURIComponent(id) + '&mode=Delivery';

        a.style.setProperty('--panopto-thumb', 'url("' + thumb + '")');
        a.setAttribute('data-thumb-set', '1');
        a.setAttribute('data-thumb-url', thumb);
      }

      // Parse and apply metadata from session name if not already set
      if (a.getAttribute('data-meta-set') !== '1') {
        // Get the text content (excluding any child elements we might add)
        var textNodes = [];
        for (var j = 0; j < a.childNodes.length; j++) {
          if (a.childNodes[j].nodeType === Node.TEXT_NODE) {
            textNodes.push(a.childNodes[j].textContent);
          }
        }
        var sessionText = textNodes.join('').trim();
        var meta = parseSessionName(sessionText);
        
        if (meta) {
          a.setAttribute('data-meta-set', '1');
          a.classList.add('has-panopto-meta');
          
          // Remove existing text nodes
          for (var k = a.childNodes.length - 1; k >= 0; k--) {
            if (a.childNodes[k].nodeType === Node.TEXT_NODE) {
              a.removeChild(a.childNodes[k]);
            }
          }
          
          var mainTitle = meta.topic || meta.original || 'Recording';
          
          // THUMBNAIL LAYOUT: Title in separate span below thumbnail
          var titleSpan = document.createElement('span');
          titleSpan.className = 'panopto-thumb-title';
          titleSpan.textContent = mainTitle;
          a.appendChild(titleSpan);
          
          // Create subtitle with week badge and/or date
          var dateSpan = document.createElement('span');
          dateSpan.className = 'panopto-meta-date';
          
          if (meta.week) {
            var weekBadge = document.createElement('span');
            weekBadge.className = 'panopto-week-badge';
            weekBadge.textContent = 'Week ' + meta.week;
            dateSpan.appendChild(weekBadge);
          }
          if (meta.day) {
            var dayBadge = document.createElement('span');
            dayBadge.className = 'panopto-day-badge';
            dayBadge.textContent = 'Day ' + meta.day;
            dateSpan.appendChild(dayBadge);
          }
          if (meta.date) {
            // Show only the date part (strip time)
            var dateOnly = meta.date.split(' ')[0];
            var dateText = document.createTextNode('📅 ' + dateOnly);
            dateSpan.appendChild(dateText);
          }
          if (meta.week || meta.day || meta.date) {
            a.appendChild(dateSpan);
          }
          
          // Create tooltip span for original name (shown on hover via CSS)
          if (meta.original) {
            var tooltipSpan = document.createElement('span');
            tooltipSpan.className = 'panopto-meta-tooltip';
            tooltipSpan.textContent = '📁 ' + meta.original;
            a.appendChild(tooltipSpan);
          }
        } else {
          // Unrenamed session - wrap text in styled span for consistent appearance
          a.setAttribute('data-meta-set', '1');
          a.classList.add('has-panopto-meta');
          
          var plainText = sessionText || 'Recording';
          
          for (var k = a.childNodes.length - 1; k >= 0; k--) {
            if (a.childNodes[k].nodeType === Node.TEXT_NODE) {
              a.removeChild(a.childNodes[k]);
            }
          }
          
          var titleSpan = document.createElement('span');
          titleSpan.className = 'panopto-thumb-title';
          titleSpan.textContent = plainText;
          a.appendChild(titleSpan);
        }
      }
    }
  }

  // Run now
  transformLiveSessions();
  show4InCollapsed();
  applyPanoptoEnhancements();

  // Re-run after clicking Show all/less
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (t && t.id === 'showAllToggle') {
      setTimeout(function() {
        transformLiveSessions();
        show4InCollapsed();
        applyPanoptoEnhancements();
      }, 50);
      setTimeout(function() {
        transformLiveSessions();
        show4InCollapsed();
        applyPanoptoEnhancements();
      }, 250);
    }
  });

  // Watch for DOM changes (important for AJAX-loaded content)
  var block = document.querySelector('.block_panopto');
  if (block && window.MutationObserver) {
    var obs = new MutationObserver(function () {
      transformLiveSessions();
      show4InCollapsed();
      applyPanoptoEnhancements();
    });
    obs.observe(block, { childList: true, subtree: true, attributes: true });
  }
});
</script>
